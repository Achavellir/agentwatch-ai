[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agentwatch-local"
version = "0.3.0"
description = "Offline policy and anomaly triage for developer-owned agent logs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["scikit-learn==1.7.2"]

[project.scripts]
agentwatch = "agentwatch:main"
agentwatch-ui = "agentwatch_ui:main"

[tool.setuptools]
py-modules = ["agentwatch", "trace_writer"]

[tool.setuptools.packages.find]
include = ["agentwatch_ui"]

[tool.setuptools.package-data]
agentwatch_ui = ["*.html", "*.js", "*.css"]
